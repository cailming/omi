name: OmiGlass ESP-IDF v6.1

on:
  push:
    branches:
      - feature/omiglass-esp-idf-migration
    paths:
      - "omiGlass/esp32/**"
      - ".github/workflows/omiglass-esp-idf.yml"
  pull_request:
    paths:
      - "omiGlass/esp32/**"
      - ".github/workflows/omiglass-esp-idf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESP32-S3 build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 确认 ESP-IDF 版本
        shell: bash
        run: |
          # GitHub Actions 会覆盖官方镜像的默认 entrypoint，因此需要显式加载 ESP-IDF 环境。
          source "$IDF_PATH/export.sh"
          idf.py --version

      - name: 编译 OmiGlass ESP-IDF 固件
        shell: bash
        working-directory: omiGlass/esp32
        run: |
          # 与上一步相同，每个 shell step 都是独立进程，需要重新加载 ESP-IDF 环境。
          source "$IDF_PATH/export.sh"
          idf.py set-target esp32s3

          # 保留完整编译日志，同时在失败时把关键错误提升为 GitHub Annotation。
          # 这样即使 Actions 原始日志过大，Chat 模式仍能从公开 Job 页面读取具体编译错误。
          set +e
          idf.py build 2>&1 | tee idf-build.log
          build_rc=${PIPESTATUS[0]}
          set -e

          if [ "$build_rc" -ne 0 ]; then
            echo "ESP-IDF build failed with exit code $build_rc"

            grep -E -i \
              '(^|[[:space:]])(fatal error:|error:|CMake Error|ninja: error:|FAILED:|undefined reference|does not fit|overflowed by)' \
              idf-build.log \
              | tail -n 40 \
              | while IFS= read -r line; do
                  # GitHub workflow command 需要转义百分号和换行控制字符。
                  escaped=${line//'%'/'%25'}
                  escaped=${escaped//$'\r'/'%0D'}
                  escaped=${escaped//$'\n'/'%0A'}
                  echo "::error title=ESP-IDF build::${escaped}"
                done

            exit "$build_rc"
          fi

          # 当前 app0/app1 均为 0x1C0000。成功后直接报告固件大小和 OTA Slot 余量，
          # 便于判断 Native ESP-IDF + Wi-Fi/TLS/证书包后是否需要扩展 8MB Flash 分区布局。
          firmware_bin="build/omiglass_esp_idf.bin"
          ota_slot_bytes=$((0x1C0000))
          firmware_bytes=$(stat -c '%s' "$firmware_bin")
          margin_bytes=$((ota_slot_bytes - firmware_bytes))
          usage_percent=$((firmware_bytes * 100 / ota_slot_bytes))

          echo "::notice title=OmiGlass firmware size::firmware=${firmware_bytes} bytes, OTA slot=${ota_slot_bytes} bytes, margin=${margin_bytes} bytes, usage=${usage_percent}%"
