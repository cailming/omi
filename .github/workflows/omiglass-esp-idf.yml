name: OmiGlass ESP-IDF v6.1

on:
  push:
    branches:
      - feature/omiglass-esp-idf-migration
    paths:
      - "omiGlass/esp32/**"
      - ".github/workflows/omiglass-esp-idf.yml"
  pull_request:
    paths:
      - "omiGlass/esp32/**"
      - ".github/workflows/omiglass-esp-idf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESP32-S3 build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认 ESP-IDF 版本
        shell: bash
        run: |
          # GitHub Actions 会覆盖官方镜像的默认 entrypoint，因此需要显式加载 ESP-IDF 环境。
          source "$IDF_PATH/export.sh"
          idf.py --version

      - name: 编译 OmiGlass ESP-IDF 固件
        shell: bash
        working-directory: omiGlass/esp32
        run: |
          # 与上一步相同，每个 shell step 都是独立进程，需要重新加载 ESP-IDF 环境。
          source "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
